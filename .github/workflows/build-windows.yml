# Baut die Windows-Anwendung.
#
# Hintergrund: PyInstaller kann nicht plattformuebergreifend bauen - eine
# Windows-Exe entsteht nur auf einem Windows-System. Wer keine
# Python-Installation auf dem Zielrechner hat, laedt das Ergebnis dieses
# Laufs herunter: Actions -> Lauf auswaehlen -> Artefakt "TradingTool-windows".

name: Windows-Build

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xlsx]"
      - name: Linter
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Universumsliste pruefen
        run: python -m trading_tool universe

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xlsx]"
      - name: Exe bauen
        run: pyinstaller build/trading_tool.spec --noconfirm --clean
      - name: Startversuch Kommandozeile
        # Ein Build, der nur fehlerfrei durchlaeuft, sagt wenig. Jeder Befehl
        # wird einzeln geprueft - in PowerShell propagiert sonst nur der letzte
        # seinen Exit-Code, und ein Fehlschlag davor bliebe unsichtbar.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ausgabe = & dist\TradingTool\TradingTool.exe universe 2>&1 | Out-String
          Write-Host $ausgabe
          if ($LASTEXITCODE -ne 0) { throw "universe endete mit $LASTEXITCODE" }
          if ($ausgabe -notmatch "Instrumente verwendbar") { throw "universe ohne erwartete Ausgabe" }

          $ausgabe = & dist\TradingTool\TradingTool.exe rules 2>&1 | Out-String
          Write-Host $ausgabe
          if ($LASTEXITCODE -ne 0) { throw "rules endete mit $LASTEXITCODE" }
          if ($ausgabe -notmatch "Regelbausteine") { throw "rules ohne erwartete Ausgabe" }

          # Belegt zugleich, dass cryptography samt Rust-Anteil im Bundle liegt -
          # eine haeufige Luecke bei PyInstaller, die erst zur Laufzeit auffaellt.
          $ausgabe = & dist\TradingTool\TradingTool.exe zertifikat 2>&1 | Out-String
          Write-Host $ausgabe
          if ($LASTEXITCODE -ne 0) { throw "zertifikat endete mit $LASTEXITCODE" }
          if ($ausgabe -notmatch "Zertifikat bereit") { throw "zertifikat ohne erwartete Ausgabe" }

          # netzcheck endet absichtlich mit 1, wenn etwas fehlt - im frischen
          # Container ist der Netzzugriff aus, also ist 1 das richtige Ergebnis.
          $ausgabe = & dist\TradingTool\TradingTool.exe netzcheck 2>&1 | Out-String
          Write-Host $ausgabe
          if ($ausgabe -notmatch "Netzwerkpruefung") { throw "netzcheck ohne erwartete Ausgabe" }
          if ($ausgabe -notmatch "Firewall") { throw "netzcheck prueft die Firewall nicht" }

      - name: Startversuch Oberflaeche
        # Der eigentliche Anwendungsfall. universe und rules fassen FastAPI,
        # uvicorn und die Vorlagen nicht an - die Exe koennte die
        # Kommandozeile bedienen und beim Start der Oberflaeche abstuerzen.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:TRADING_TOOL_DATA_DIR = "$env:RUNNER_TEMP\tt-daten"
          $prozess = Start-Process -FilePath "dist\TradingTool\TradingTool.exe" `
            -ArgumentList "serve","--port","8765","--no-browser" -PassThru `
            -RedirectStandardOutput server-out.log -RedirectStandardError server-err.log

          $erreichbar = $false
          foreach ($versuch in 1..30) {
            Start-Sleep -Seconds 2
            if ($prozess.HasExited) { break }
            try {
              $antwort = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
              if ($antwort.StatusCode -eq 200 -and $antwort.Content -match "Keine Anlageberatung") {
                $erreichbar = $true; break
              }
            } catch { }
          }

          if ($erreichbar) {
            # Vorlagen, Stylesheet und SVG-Chart einzeln anfassen: Bei
            # PyInstaller fehlen genau solche Dateien gern im Bundle.
            foreach ($pfad in @("/screener/kurz_pullback", "/universe", "/einstellungen",
                                "/datenqualitaet", "/kurse",
                                "/static/app.css", "/static/poll.js", "/static/pwa.js",
                                "/manifest.webmanifest", "/sw.js", "/icons/icon-192.png")) {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8765$pfad" -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -ne 200) { $erreichbar = $false; Write-Host "FEHLT: $pfad" }
            }
          }

          Write-Host "--- Ausgabe der Anwendung ---"
          Get-Content server-out.log, server-err.log -ErrorAction SilentlyContinue
          Stop-Process -Id $prozess.Id -Force -ErrorAction SilentlyContinue
          if (-not $erreichbar) { throw "Oberflaeche nicht erreichbar oder unvollstaendig" }
      - name: Startanleitung beilegen
        run: Copy-Item docs\WINDOWS.md dist\TradingTool\LIESMICH.md
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: TradingTool-windows
          path: dist/TradingTool
          retention-days: 30
